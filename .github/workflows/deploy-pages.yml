name: Frontend · Redirección de GitHub Pages

# La app se publica en Firebase Hosting (https://<proyecto>.web.app) con
# scripts/configurar.sh. Esta dirección antigua de GitHub Pages solo redirige
# a la nueva y retira la copia guardada en los celulares (service worker).

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar páginas de redirección
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          DEST="https://${PROJECT_ID:-brigada-pws}.web.app/"
          mkdir -p site
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Brigadas de Emergencia – nueva dirección</title>
          <meta http-equiv="refresh" content="2; url=${DEST}">
          <style>body{font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:20px;text-align:center;color:#222}
          a{display:inline-block;margin-top:16px;padding:14px 22px;background:#B71C1C;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}</style>
          </head><body>
          <h1 style="color:#B71C1C">La app cambió de dirección</h1>
          <p>Brigadas de Emergencia ahora está en<br><strong>${DEST}</strong></p>
          <p>Si instaló la versión anterior, desinstálela e instale la nueva.</p>
          <a href="${DEST}">Ir a la app</a>
          <script>
            if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
            if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
            setTimeout(function () { location.replace('${DEST}' + location.hash); }, 1500);
          </script>
          </body></html>
          EOF
          cp site/index.html site/404.html
          # Service worker "de retiro": reemplaza al anterior, borra su caché y se desinstala
          cat > site/sw.js <<EOF
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => {
            e.waitUntil((async () => {
              for (const k of await caches.keys()) await caches.delete(k);
              await self.registration.unregister();
              const cs = await self.clients.matchAll({ type: 'window' });
              cs.forEach((c) => c.navigate('${DEST}'));
            })());
          });
          EOF
          touch site/.nojekyll
          ls -la site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
